<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BizUni — Student Dashboard</title>
<style>
:root{--pri:#4169e1;--pd:#2f52c4;--pl:#e8eefc;--bg:#f4f6fa;--bgg:none;--sh:none;--card:#fff;--tx:#18202f;--mu:#667085;--bd:#e3e7ee;--ok:#12805c;--wa:#b7791f;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--pl:#1f2a4d;--bg:#10141c;--bgg:none;--sh:none;--card:#171c27;--tx:#e8ecf4;--mu:#98a2b3;--bd:#262d3b;--pri:#6f90f0}}
:root[data-theme=dark]{--pl:#1f2a4d;--bg:#10141c;--bgg:none;--sh:none;--card:#171c27;--tx:#e8ecf4;--mu:#98a2b3;--bd:#262d3b;--pri:#6f90f0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);background-image:var(--bgg);background-attachment:fixed;color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3{margin:0 0 8px;line-height:1.2}p{margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
.btn{background:var(--pri);color:#fff;border:0;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600}.btn:hover{background:var(--pd)}.btn.g{background:var(--pl);color:var(--pri)}.btn.d{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pl);color:var(--pri)}.tag.ok{background:#dcf5ea;color:var(--ok)}.tag.wa{background:#fdf0d5;color:var(--wa)}.tag.er{background:#fde4e1;color:var(--er)}
.stat b{display:block;font-size:26px}
/* landing */
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:var(--card);border-bottom:1px solid var(--bd)}.logo{font-weight:800;color:var(--pri);font-size:19px}
.hero{padding:64px 5vw;background:linear-gradient(160deg,var(--pl),var(--card));text-align:center}.hero h1{font-size:clamp(28px,5vw,48px);max-width:760px;margin:0 auto 14px}.hero p{max-width:620px;margin:0 auto 22px;color:var(--mu);font-size:17px}
.sec{padding:40px 5vw;max-width:1100px;margin:auto}.step{font-size:28px;font-weight:800;color:var(--pri)}
/* app */
.app{display:flex;min-height:100vh}.side{width:230px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
.side a{display:block;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--mu);font-weight:500;margin-bottom:2px}.side a.on,.side a:hover{background:var(--pl);color:var(--pri)}
.main{flex:1;min-width:0}.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.top input{max-width:320px}.ct{padding:20px;max-width:1100px}
.burger{display:none}
@media(max-width:800px){.side{position:fixed;z-index:20;left:-240px;transition:left .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}.side.open{left:0}.burger{display:inline-block}.ct{padding:14px}}
.bar{display:flex;align-items:flex-end;gap:8px;height:150px}.bar div{flex:1;background:var(--pri);border-radius:6px 6px 0 0;position:relative;min-height:4px}.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mu)}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}.sc{overflow-x:auto}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;margin:5px 0;background:var(--pl)}.msg.me{margin-left:auto;background:var(--pri);color:#fff}
.chat{display:grid;grid-template-columns:240px 1fr;gap:14px}@media(max-width:800px){.chat{grid-template-columns:1fr}}
.th{padding:10px;border-radius:10px;cursor:pointer}.th.on,.th:hover{background:var(--pl)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal .card{max-width:440px;width:100%;margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18202f;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;display:none}
.tbtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);font-size:28px;cursor:pointer;z-index:30;box-shadow:0 4px 14px #0003}
.tp{position:fixed;right:18px;bottom:86px;width:min(340px,calc(100vw - 36px));z-index:30;display:none;margin:0}.tp .log{height:240px;overflow:auto}
.cgrid{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:14px;align-items:start}@media(max-width:1000px){.cgrid{grid-template-columns:1fr}}.calw{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wk{text-align:center;color:var(--mu);font-size:12px}.cd{min-height:88px;border:1px solid var(--bd);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden;font-size:12px}.cd.td{border-color:var(--pri);border-width:2px}.cd.sl{background:var(--pl)}.ce{background:var(--pri);color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.ce.x{background:#8d99ae}@media(max-width:1000px){.calw{grid-template-columns:1fr}}@media(max-width:600px){.cd{min-height:54px}.ce{font-size:0;height:6px;padding:0}}.dg{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:1000px){.dg{grid-template-columns:1fr}}.live{animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}
</style></head><body>
<div id="root"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const TR={en:{dash:'Dashboard',verify:'Profile',protos:'My Prototypes',post:'Post Prototype',msgs:'Messages',calls:'Calls',collab:'Deals & Collabs',rev:'Revenue',cal:'Calendar',set:'Settings'},
ms:{dash:'Papan Pemuka',verify:'Profil',protos:'Prototaip Saya',post:'Hantar Prototaip',msgs:'Mesej',calls:'Panggilan',collab:'Tawaran & Kerjasama',rev:'Hasil',cal:'Kalendar',set:'Tetapan'},
es:{dash:'Panel',verify:'Perfil',protos:'Mis prototipos',post:'Publicar prototipo',msgs:'Mensajes',calls:'Llamadas',collab:'Ofertas y colaboraciones',rev:'Ingresos',cal:'Calendario',set:'Ajustes'}};
const S={view:'dash',nav:false,lang:'en',vs:'verified',ptab:'list',q:'',cat:'All',st:'All',th:0,dt:'all',cm:{y:2026,m:9},cd:'2026-10-10',call:'idle',cb:0,sec:0,stt:false,txt:'',sum:null,theme:'light',pf:{name:'Areeba',uni:'Sample University',course:'BSc Computer Science, Year 3',skills:'Java, systems design, UI',bio:'Third-year computing student building practical tools for small businesses.'},linked:{google:false,outlook:false},perm:null,sel:null,
protos:[{n:'StockSync Inventory',c:'Retail',s:'Verified',d:'Offline-first stock tracker for small shops with reorder alerts.',r:4.8,v:312,rv:[['Lina Bakery','Solved our shelf-count chaos.',5],['Mario Hardware','Needs barcode scanning.',4]]},
{n:'BookEasy Scheduler',c:'Services',s:'Verified',d:'Appointment booking with SMS reminders for salons and clinics.',r:4.6,v:204,rv:[['Glow Salon','Clean UI, clients loved it.',5]]},
{n:'GreenRoute Delivery',c:'Logistics',s:'Pending',d:'Route optimizer for local couriers using Java and a greedy heuristic.',r:0,v:41,rv:[]},
{n:'CafeQueue POS',c:'Food',s:'Draft',d:'Queue and order screen for busy cafes.',r:0,v:0,rv:[]}],
threads:[{b:'Lina Bakery',m:[[0,'Hi Areeba! Could StockSync track expiry dates?'],[1,'Yes, I can add batch expiry. Want a call?']]},{b:'Mario Hardware',m:[[0,'Is barcode scanning possible on mobile?']]},{b:'Glow Salon',m:[[0,'Thanks for the demo link!']]}],
offers:[{id:1,b:'Lina Bakery',p:['StockSync Inventory','BookEasy Scheduler'],bud:'RM 4,500',s:'pending',t:'collab'},{id:2,b:'Mario Hardware',p:['StockSync Inventory','GreenRoute Delivery'],bud:'RM 3,200',s:'pending',t:'collab'},{id:3,b:'Glow Salon',p:['BookEasy Scheduler'],bud:'RM 410',s:'pending',t:'deal',note:'Branding, WhatsApp reminders, calendar per stylist'},{id:4,b:'Kopi Corner',p:['CafeQueue POS'],bud:'RM 1,100',s:'pending',t:'deal',note:'Queue screen and order tracker'},{id:5,b:'PrintPro',p:['StockSync Inventory'],bud:'RM 600',s:'accepted',t:'deal',note:'In progress, due Nov 2'}],
deals:[['Glow Salon','Booking widget',1800,'Aug 2026'],['Kopi Corner','Order tracker',1200,'Jun 2026'],['PrintPro','Quote calculator',950,'Apr 2026'],['Lina Bakery','Stock alerts v1',2200,'Sep 2026']],
mon:[['May',0],['Jun',1200],['Jul',0],['Aug',1800],['Sep',2200],['Oct',0]],
ev:[['Intro call — Lina Bakery','Oct 12, 2:00 PM','BizUni','2026-10-12'],['OS exam revision','Oct 14, 9:00 AM','Calendar','2026-10-14'],['Report draft due','Oct 20, 11:59 PM','Calendar','2026-10-20'],['Glow Salon check-in','Oct 22, 10:00 AM','BizUni','2026-10-22']]};
const t=k=>TR[S.lang][k]||k;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e.h);e.h=setTimeout(()=>e.style.display='none',2600)}
function go(v){if(v==='post'){S.ptab='post';v='protos'}else if(v==='protos')S.ptab='list';S.view=v;S.nav=false;render();scrollTo(0,0)}
const V=()=>S.vs==='verified';
function badge(){return S.vs==='verified'?'<span class="tag ok">✓ Verified</span>':S.vs==='review'?'<span class="tag wa">In review</span>':'<span class="tag er">Not verified</span>'}
/* LANDING */
function landing(){return `<div class="nav"><span class="logo">BizUni</span><button class="btn" onclick="go('dash')">Open student portal</button></div>
<div class="hero"><span class="tag">For university students</span><h1>Turn your assignment prototypes into real client work</h1><p>Showcase verified prototypes. Local small businesses discover them, reach out, and hire you to build a personalised version that solves a real problem.</p><button class="btn" onclick="go('dash')">Get started</button> <button class="btn g" onclick="document.getElementById('how').scrollIntoView({behavior:'smooth'})">How it works</button></div>
<div class="sec" id="how"><h2>How it works</h2><div class="grid">${[['1','Verify','Upload your student ID or passport plus a report proving the prototype is yours.'],['2','Get discovered','Owners browse, review and message you about your work.'],['3','Talk it through','Calls with live speech-to-text and an automatic summary.'],['4','Get paid','Accept offers, track revenue and build a deal history.']].map(x=>`<div class="card"><div class="step">${x[0]}</div><h3>${x[1]}</h3><p class="mu">${x[2]}</p></div>`).join('')}</div></div>
<div class="sec"><h2>Built for students</h2><div class="grid">${['Verified badge builds trust','Calendar sync with your permission','Collab offers: accept or decline','Revenue tracker and past deals','Timmy the AI study-turtle','Multi-language interface'].map(x=>`<div class="card">✔ ${x}</div>`).join('')}</div></div>`}
/* VIEWS */
const VW={
dash(){const pend=S.offers.filter(o=>o.s==='pending'),tot=S.deals.reduce((a,d)=>a+d[2],0),mx=Math.max(...S.mon.map(m=>m[1]));
return `<h2>Hey Areeba</h2><p class="mu">Here's what's happening on your profile. ${badge()}</p>
${V()?'':`<div class="card" style="background:var(--pl)"><b>Verify to go live.</b> Businesses can't see your prototypes until you're verified. <button class="btn sm" onclick="go('verify')">Verify now</button></div>`}
<div class="grid"><div class="card stat"><span class="mu">Profile views</span><b>${S.protos.reduce((a,p)=>a+p.v,0)}</b></div><div class="card stat"><span class="mu">Open offers</span><b>${pend.length}</b></div><div class="card stat"><span class="mu">Total earned</span><b>RM ${tot.toLocaleString()}</b></div><div class="card stat"><span class="mu">Avg rating</span><b>4.7★</b></div></div>
<div class="dg"><div><div class="card"><h3>Pending offers and deals</h3>${pend.map(o=>`<div class="row sp" style="margin:6px 0"><span>${o.b} wants <b>${o.p.join(' + ')}</b></span><button class="btn sm g" onclick="go('collab')">Review</button></div>`).join('')||'<p class="mu">Nothing pending.</p>'}</div>
<div class="card"><h3>Upcoming</h3>${S.ev.slice().sort((a,b)=>a[3]>b[3]?1:-1).slice(0,5).map(e=>`<div class="row sp" style="margin:6px 0"><span>${e[0]}</span><span class="mu">${e[1]}</span></div>`).join('')}</div></div>
<div><div class="card"><div class="row sp"><h3>Revenue</h3><span class="tag ok">RM ${tot.toLocaleString()}</span></div><div class="bar" style="height:110px;margin:10px 0 30px">${S.mon.map(m=>`<div style="height:${m[1]/mx*100}%" title="RM ${m[1]}"><span>${m[0]}</span></div>`).join('')}</div><h3>Successful deals</h3>${S.deals.map(d=>`<div class="row sp" style="margin:8px 0"><span>${d[0]}<br><span class="mu">${d[1]} · ${d[3]}</span></span><b>RM ${d[2].toLocaleString()}</b></div>`).join('')}</div></div></div>`},
verify(){const f=S.pf;return `<h2>Profile</h2><p class="mu">Your public profile and verification. Status: ${badge()}</p>
<div class="card"><div class="row" style="margin-bottom:14px"><div class="tag" style="width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px">${(f.name[0]||'A').toUpperCase()}</div><div><h3 style="margin:0">${f.name} ${V()?'<span class="tag ok">Verified</span>':''}</h3><span class="mu">${f.uni||'Add your university'}</span></div></div>
<div class="grid"><div><label class="mu">Full name</label><input id="pn" value="${f.name}"></div><div><label class="mu">University</label><input id="pu" value="${f.uni}" placeholder="Your university"></div><div><label class="mu">Course and year</label><input id="pc" value="${f.course}" placeholder="e.g. Computer Science, Year 3"></div><div><label class="mu">Skills</label><input id="ps" value="${f.skills}" placeholder="e.g. Java, UI design"></div></div><br><label class="mu">Bio</label><textarea id="pb" rows="3" placeholder="Tell businesses what you build">${f.bio}</textarea><br><br><button class="btn" onclick="saveP()">Save profile</button></div>
<h3>Verification</h3>${V()?`<div class="card"><div class="row sp"><div><b>Identity verified</b><p class="mu" style="margin:2px 0 0">Student ID ending 3456 · verified 02 Oct 2026</p></div><span class="tag ok">Verified</span></div><br><button class="btn sm d" onclick="S.vs='none';render()">Reset verification (demo)</button></div>`:`<div class="card"><h3>Student ID or passport</h3><div class="grid"><div><label class="mu">Document type</label><select id="idt"><option>Student ID</option><option>Passport</option></select></div><div><label class="mu">Document number</label><input id="idn" placeholder="e.g. 2024123456"></div></div><br><label class="mu">Upload photo of document</label><input type="file" id="idf" accept="image/*,.pdf"></div>
<button class="btn" ${S.vs!=='none'?'disabled':''} onclick="submitV()">${S.vs==='none'?'Submit for verification':'Submitted'}</button>`}`},
protos(){if(S.ptab==='post')return `<h2>My Prototypes</h2>${tabs()}`+VW.post();return `<h2>My Prototypes</h2>${tabs()}
<div class="row"><input style="flex:2;min-width:160px" placeholder="Search your prototypes…" value="${S.q}" oninput="S.q=this.value;list()"><select style="flex:1;min-width:120px" onchange="S.cat=this.value;list()">${['All','Retail','Services','Logistics','Food'].map(c=>`<option ${c===S.cat?'selected':''}>${c}</option>`).join('')}</select><select style="flex:1;min-width:120px" onchange="S.st=this.value;list()">${['All','Verified','Pending','Draft'].map(c=>`<option ${c===S.st?'selected':''}>${c}</option>`).join('')}</select></div><br><div id="pl">${plist()}</div>`},
post(){if(!V())return `<h3>Post a prototype</h3><div class="card"><h3>Verify your identity first</h3><p class="mu">Businesses only see prototypes from verified students. Add your student ID or passport in Profile, then come back.</p><button class="btn" onclick="go('verify')">Go to Profile</button></div>`;
return `<h3>Post a prototype</h3><p class="mu">Share a prototype with businesses. We check ownership before it goes live.</p>
<div class="card"><h3>Details</h3><div class="grid"><div><label class="mu">Prototype name</label><input id="pt" placeholder="e.g. StockSync Inventory"></div><div><label class="mu">Category</label><select id="pcat"><option>Retail</option><option>Services</option><option>Logistics</option><option>Food</option><option>Education</option><option>Other</option></select></div><div><label class="mu">Demo link (optional)</label><input id="plink" placeholder="https://"></div><div><label class="mu">Course or assignment</label><input id="pcrs" placeholder="e.g. Software Architecture, Assignment 2"></div></div><br><label class="mu">What does it do?</label><textarea id="pd" rows="3" placeholder="Describe the prototype and the problem it solves"></textarea></div>
<div class="card"><h3>Proof you own it</h3><p class="mu">Upload your report, assignment brief or marked grade sheet. Add a supervisor if someone can vouch for it.</p><input type="file" id="pdoc" multiple accept=".pdf,.doc,.docx,.png,.jpg"><br><br><label class="mu">Supervisor or lecturer (optional)</label><input id="psup" placeholder="Name and email"></div>
<div class="card"><h3>Rights confirmation</h3>${['I created this prototype myself, or my teammates have agreed to it being posted.','My university or course policy allows me to share and sell work based on it.','It contains no third-party code, data or branding that I do not have permission to use.'].map((x,i)=>`<label class="row" style="margin:8px 0;align-items:flex-start;flex-wrap:nowrap"><input type="checkbox" id="rc${i}" style="width:auto;margin-top:4px"><span>${x}</span></label>`).join('')}</div>
<button class="btn" onclick="postP()">Submit for review</button>`},
msgs(){const th=S.threads[S.th];return `<h2>Messages</h2><div class="chat"><div class="card">${S.threads.map((x,i)=>`<div class="th ${i===S.th?'on':''}" onclick="S.th=${i};render()"><b>${x.b}</b><div class="mu">${x.m[x.m.length-1][1].slice(0,32)}…</div></div>`).join('')}</div>
<div class="card"><h3>${th.b}</h3><div id="ml">${th.m.map(m=>`<div class="msg ${m[0]?'me':''}">${m[1]}</div>`).join('')}</div><div class="row" style="margin-top:10px"><input id="mi" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendM()"><button class="btn" onclick="sendM()">Send</button></div></div></div>`},
calls(){const b=BZ[S.cb],live=S.call==='live';return `<h2>Calls</h2><p class="mu">Speech to text runs during the call. Timmy summarises afterwards and can add the follow-up to your calendar.</p>
<div class="cgrid"><div class="card"><select onchange="pickB(this.value)">${BZ.map((x,i)=>`<option value="${i}" ${i===S.cb?'selected':''}>${x.o} (${x.n})</option>`).join('')}</select>
<div style="text-align:center;margin:22px 0"><div id="tm" style="font-size:46px;font-weight:800">${fmt()}</div><div class="mu">${live?'On call':S.call==='done'?'Call ended':'Ready to call'}</div></div>
<div class="row" style="justify-content:center"><button class="btn" ${live?'style="background:var(--er)" onclick="endCall()"':'onclick="startCall()"'}>${live?'End call':'Start call'}</button><button class="btn d" onclick="toggleStt()">${S.stt?'Stop speech to text':'Start speech to text'}</button></div>${S.stt?'<p class="live tag er" style="margin-top:14px">Transcribing</p>':''}</div>
<div class="card"><h3>Live transcript (or paste one)</h3><textarea id="tx" rows="12" placeholder="Press Start speech to text to run the demo, or paste a transcript here." oninput="S.txt=this.value">${S.txt}</textarea><br><br><button class="btn" onclick="summ()">End and summarise</button></div>
<div class="card"><h3>Call briefing</h3><div class="row" style="margin-bottom:12px"><div class="tag" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center">${b.n.split(' ').map(w=>w[0]).join('')}</div><div><b>${b.o}</b><div class="mu">${b.n} · ${b.loc} · ${b.r}★</div></div></div>
<h3>Prototype</h3><p>${b.p} <span class="tag">${b.tag}</span></p><div class="row" style="gap:28px"><div><span class="mu">Standard</span><br><b style="font-size:24px">RM${b.std}</b></div><div><span class="mu">Est. final</span><br><b style="font-size:24px">≈ RM${b.est}</b></div></div>
<p class="mu" style="margin-top:12px">Likely changes</p>${b.ch.map(c=>`<div>→ ${c}</div>`).join('')}
<h3 style="margin-top:14px">Previous calls</h3>${b.prev.map(x=>`<div class="mu">${x[0]} · ${x[1]}</div>`).join('')}</div></div>
${S.sum?`<div class="card" style="border-color:var(--pri)"><h3>Timmy's call summary · ${b.o}</h3><ul><li>${S.sum.join('</li><li>')}</li></ul><button class="btn" onclick="S.perm=1;render()">Add follow-up to calendar</button></div>`:''}`},
collab(){const f=S.dt,n=k=>S.offers.filter(o=>k==='all'||o.t===k).length,l=S.offers.filter(o=>f==='all'||o.t===f);return `<h2>${t('collab')}</h2><p class="mu">Collaboration offers come when an owner likes two of your prototypes. Standard deals are one business and one prototype.</p>
<div class="row" style="margin-bottom:12px">${[['all','All'],['collab','Collaborations'],['deal','Standard deals']].map(x=>`<button class="btn sm ${f===x[0]?'':'g'}" onclick="S.dt='${x[0]}';render()">${x[1]} (${n(x[0])})</button>`).join('')}</div>
${l.map(o=>`<div class="card"><div class="row sp"><div><span class="tag">${o.t==='collab'?'Collaboration':'Standard deal'}</span><h3 style="margin-top:6px">${o.b}</h3><p>${o.t==='collab'?'Liked: <b>'+o.p.join('</b> and <b>')+'</b>':'Prototype: <b>'+o.p[0]+'</b>'}</p>${o.note?`<p class="mu">${o.note}</p>`:''}<p class="mu">Budget ${o.bud}</p></div>${o.s==='pending'?`<div class="row"><button class="btn" onclick="offer(${o.id},'accepted')">Accept</button><button class="btn d" onclick="offer(${o.id},'declined')">Decline</button></div>`:`<span class="tag ${o.s==='accepted'?'ok':'er'}">${o.s}</span>`}</div></div>`).join('')||'<p class="mu">Nothing here.</p>'}`},
cal(){const{y,m}=S.cm,off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),all=evAll(),c=[];
for(let i=0;i<off;i++)c.push('<div></div>');
for(let d=1;d<=dim;d++){const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ev=all.filter(e=>e[3]===iso);
c.push(`<div class="cd ${iso===TODAY?'td':''} ${iso===S.cd?'sl':''}" onclick="S.cd='${iso}';render()"><b>${d}</b>${ev.slice(0,2).map(e=>`<div class="ce ${e[2]==='BizUni'?'':'x'}">${e[0]}</div>`).join('')}${ev.length>2?`<div class="mu">+${ev.length-2} more</div>`:''}</div>`)}
const sel=all.filter(e=>e[3]===S.cd);
return `<div class="row sp"><h2>Calendar</h2><div class="row"><button class="btn sm d" onclick="calNav(-1)">Prev</button><b>${new Date(y,m,1).toLocaleString('en',{month:'long'})} ${y}</b><button class="btn sm d" onclick="calNav(1)">Next</button><button class="btn sm g" onclick="S.cm={y:2026,m:9};S.cd=TODAY;render()">Today</button></div></div>
<div class="calw"><div class="card"><div class="cg">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="wk">${x}</div>`).join('')}${c.join('')}</div><p class="mu" style="margin-top:10px">Blue: BizUni events. Grey: your own and linked calendars.</p></div>
<div><div class="card"><h3>${fmtD(S.cd)}</h3>${sel.map(e=>`<div class="row sp" style="margin:6px 0"><span><b>${e[0]}</b><br><span class="mu">${e[1].split(', ')[1]||e[1]} · ${e[2]}</span></span>${S.ev.includes(e)?`<button class="btn sm d" onclick="delEv(${S.ev.indexOf(e)})">Remove</button>`:''}</div>`).join('')||'<p class="mu">Nothing planned.</p>'}
<hr style="border:0;border-top:1px solid var(--bd);margin:12px 0"><input id="et" placeholder="Add event title"><div class="row" style="margin-top:8px"><input id="etm" type="time" value="09:00" style="flex:1"><button class="btn" onclick="addEv()">Add</button></div></div>
<div class="card"><h3>Linked calendars</h3><p class="mu">Linking asks for your permission and shows those events here.</p>${['google','outlook'].map(k=>`<div class="row sp" style="margin:8px 0"><span style="text-transform:capitalize">${k}</span><button class="btn sm ${S.linked[k]?'g':''}" onclick="S.linked.${k}=!S.linked.${k};toast(S.linked.${k}?'Permission granted. ${k} linked':'Unlinked');render()">${S.linked[k]?'Linked':'Link'}</button></div>`).join('')}</div></div></div>`},
};
const tabs=()=>`<div class="row" style="margin-bottom:14px"><button class="btn sm ${S.ptab==='post'?'g':''}" onclick="go('protos')">My prototypes</button><button class="btn sm ${S.ptab==='post'?'':'g'}" onclick="go('post')">Post new</button></div>`;
function plist(){const l=S.protos.filter(p=>(S.cat==='All'||p.c===S.cat)&&(S.st==='All'||p.s===S.st)&&(p.n+p.d).toLowerCase().includes(S.q.toLowerCase()));
return l.map(p=>`<div class="card"><div class="row sp"><h3>${p.n}</h3><span class="tag ${p.s==='Verified'?'ok':p.s==='Pending'?'wa':''}">${p.s}</span></div><p>${p.d}</p><p class="mu">${p.c} · ${p.v} views · ${p.r?p.r+'★':'no rating'}</p>${p.rv.map(r=>`<div class="msg"><b>${r[0]}</b> ${'★'.repeat(r[2])}<br>${r[1]}</div>`).join('')}</div>`).join('')||'<p class="mu">No prototypes match.</p>'}
function list(){$('#pl').innerHTML=plist()}
/* ACTIONS */
function submitV(){if(!$('#idn').value.trim()||!$('#idf').files.length)return toast('Add your ID number and a photo of your ID first');S.vs='review';render();toast('Submitted — reviewing…');setTimeout(()=>{S.vs='verified';S.protos[2].s='Verified';render();toast('You are verified! ')},2500)}
function sendM(){const i=$('#mi'),v=i.value.trim();if(!v)return;S.threads[S.th].m.push([1,v]);render();setTimeout(()=>{S.threads[S.th].m.push([0,'Thanks, got it — talk soon!']);if(S.view==='msgs')render()},1200)}
function offer(id,s){S.offers.find(o=>o.id===id).s=s;toast('Offer '+s);render()}
const BZ=[
{n:'Lina Bakery',o:'Lina T.',loc:'Petaling Jaya',r:4.9,p:'StockSync Inventory',tag:'Retail',std:480,est:600,ch:['Add batch expiry tracking','Connect supplier reorder alerts','Add barcode scanning'],prev:[['04/10/2026','Intro chat after StockSync demo']],d:['Lina: Hi Areeba, thanks for joining. I want to talk about StockSync for the bakery.','Areeba: Of course! The standard price is RM480, and it moves with how much you want changed.','Lina: We need batch expiry tracking, and alerts to our suppliers when flour runs low.','Areeba: Nice. Barcode scanning too? That would be 3 changes, so about RM600 in total.','Lina: Yes, let us include barcode scanning. Can you start next week?','Areeba: Yes! I will send a timeline today and we can follow up on the 17th.']},
{n:'Mario Hardware',o:'Mario D.',loc:'Kuala Lumpur',r:4.7,p:'StockSync Inventory',tag:'Retail',std:480,est:540,ch:['Barcode scanning on mobile','Multi-branch stock view'],prev:[['02/10/2026','Asked about mobile support']],d:['Mario: Hello Areeba, I run two hardware shops and stock gets messy.','Areeba: StockSync is RM480 as is. Which parts need changing?','Mario: Scanning barcodes from a phone, and one view for both branches.','Areeba: That is 2 changes, so around RM540.','Mario: Good. Send me a short plan and I will confirm.']},
{n:'Glow Salon',o:'Priya K.',loc:'Subang Jaya',r:4.8,p:'BookEasy Scheduler',tag:'Services',std:350,est:410,ch:['Add salon branding','WhatsApp reminders','Calendar per stylist'],prev:[['22/09/2026','Delivered booking widget v1']],d:['Priya: Hi Areeba! Clients loved the booking widget.','Areeba: Happy to hear it! The standard BookEasy is RM350.','Priya: We want our branding, WhatsApp reminders and a calendar per stylist.','Areeba: That is 3 changes, around RM410 in total.','Priya: Perfect, let us book a follow-up to confirm the scope.']}];
const fmt=()=>String(Math.floor(S.sec/60)).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0');
function clr(){clearInterval(S.iv);clearInterval(S.ti)}
function pickB(i){clr();S.cb=+i;S.call='idle';S.sec=0;S.stt=false;S.txt='';S.sum=null;render()}
function startCall(){if(S.call==='live')return;S.call='live';S.sec=0;S.sum=null;S.ti=setInterval(()=>{S.sec++;const e=$('#tm');if(e)e.textContent=fmt()},1000);render()}
function toggleStt(){if(S.stt){clearInterval(S.iv);S.stt=false;render();return}
if(S.call!=='live')startCall();S.txt='';S.stt=true;S.sum=null;render();const d=BZ[S.cb].d;let i=0;S.iv=setInterval(()=>{if(i>=d.length){clearInterval(S.iv);S.stt=false;if(S.view==='calls')render();return}S.txt+=(S.txt?'\n':'')+d[i++];const ta=$('#tx');if(ta){ta.value=S.txt;ta.scrollTop=1e5}},1800)}
function endCall(){clr();S.call='done';S.stt=false;render()}
function summ(){if(!S.txt.trim())return toast('Start speech to text or paste a transcript first');const b=BZ[S.cb];clr();S.call='done';S.stt=false;if(!S.sum)b.prev.unshift(['10/10/2026','Scope: '+b.p+' with '+b.ch.length+' changes']);S.sum=['Discussed '+b.p+' with '+b.o+' from '+b.n+'.','Likely changes: '+b.ch.join(', ')+'.','Standard price RM'+b.std+', estimated final RM'+b.est+'.','Follow-up proposed for Oct 17, 3:00 PM.'];render()}
function postP(){const n=$('#pt').value.trim(),d=$('#pd').value.trim();if(!n||!d)return toast('Add a name and description');if(!$('#pdoc').files.length)return toast('Upload a document that proves it is yours');if(![0,1,2].every(i=>$('#rc'+i).checked))return toast('Confirm all three rights statements');
const x={n,c:$('#pcat').value,s:'Pending',d,r:0,v:0,rv:[]};S.protos.unshift(x);S.q='';S.cat='All';S.st='All';go('protos');toast('Submitted. Checking ownership...');setTimeout(()=>{x.s='Verified';if(S.view==='protos')render();toast('Your prototype is verified and live')},3500)}
function gs(v){const q=v.trim().toLowerCase();if(!q)return;if(S.protos.some(p=>(p.n+p.d).toLowerCase().includes(q))){S.q=v;S.cat='All';S.st='All';return go('protos')}
if(S.offers.some(o=>(o.b+o.p.join(' ')).toLowerCase().includes(q))){S.dt='all';return go('collab')}
const i=S.threads.findIndex(x=>x.b.toLowerCase().includes(q));if(i>=0){S.th=i;return go('msgs')}toast('Nothing found for "'+v+'"')}
function saveP(){S.pf={name:$('#pn').value||'Areeba',uni:$('#pu').value,course:$('#pc').value,skills:$('#ps').value,bio:$('#pb').value};toast('Profile saved');render()}
const TODAY='2026-10-10',MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const GEV=[['Lecture: Systems Design','Oct 13, 10:00 AM','Google','2026-10-13'],['Group project meeting','Oct 16, 3:00 PM','Google','2026-10-16']],OEV=[['Java lab','Oct 15, 2:00 PM','Outlook','2026-10-15']];
const evAll=()=>S.ev.concat(S.linked.google?GEV:[],S.linked.outlook?OEV:[]);
const fmtD=i=>MN[+i.slice(5,7)-1]+' '+(+i.slice(8));
function calNav(d){S.cm.m+=d;if(S.cm.m<0){S.cm.m=11;S.cm.y--}if(S.cm.m>11){S.cm.m=0;S.cm.y++}render()}
function addEv(){const tt=$('#et').value.trim();if(!tt)return toast('Give the event a title');const[h,mi]=($('#etm').value||'09:00').split(':');S.ev.push([tt,fmtD(S.cd)+', '+((h%12)||12)+':'+mi+(h<12?' AM':' PM'),'Calendar',S.cd]);toast('Event added');render()}
function delEv(i){S.ev.splice(i,1);render()}
function allow(ok){S.perm=null;if(ok){S.ev.push(['Follow-up — '+BZ[S.cb].n,'Oct 17, 3:00 PM','BizUni','2026-10-17']);toast(S.linked.google||S.linked.outlook?'Added to calendar and synced':'Added to calendar')}render()}
/* TURTLE */
let tl=[['s','Timmy here. Glasses on, opinions loaded. Ask me about verifying, offers, calls or money, and try to keep up.']];
function timmy(q){q=q.toLowerCase();const P=a=>a[Math.floor(Math.random()*a.length)];
if(/verif|passport|student id/.test(q))return P(['Add your student ID or passport in Profile. No badge, no clients, bestie. Not that deep.','Verification is one upload. I have seen slower turtles do harder things.']);
if(/money|revenue|pay|earn/.test(q))return P(['Revenue card, right side of your dashboard. Numbers go up, we love that for you.','Check the dashboard. RM is stacking faster than your assignment deadlines, respectfully.']);
if(/call|summar|transcri/.test(q))return P(['Hit Start speech to text and I do the typing. You just try not to say um forty times.','Calls tab. I listen, I summarise, you take the credit. Fair deal.']);
if(/collab|offer/.test(q))return P(['Two prototypes liked means a collab offer. Budget slaps? Accept. Doesn\'t? Decline and keep your peace.','Collaborations tab. Accept or decline, I will not judge. Out loud.']);
if(/calendar|schedule/.test(q))return 'Link it in Calendar. I always ask permission first. Sassy, not a menace.';
if(/language|theme|dark|setting/.test(q))return 'Preferences live on the dashboard now. Yes, I moved them. You are welcome.';
if(/^(hi|hey|hello|yo)/.test(q))return 'Oh, hi. Took you long enough. What do you need?';
return P(['I am a turtle with glasses, not a mind reader. Try verify, call, offer, revenue or calendar.','Bold question, zero context. Ask me about verify, calls, offers or money, slowly.'])}
function tchat(){const q=$('#ti').value.trim();if(!q)return;tl.push(['u',q],['s',timmy(q)]);drawT();$('#ti').value=''}
function drawT(){$('#tlog').innerHTML=tl.map(m=>`<div class="msg ${m[0]==='u'?'me':''}">${m[1]}</div>`).join('');$('#tlog').scrollTop=1e5}
function tog(){const p=$('#tp');p.style.display=p.style.display==='block'?'none':'block';drawT()}
/* RENDER */
function render(){const r=$('#root');if(S.view==='landing'){r.innerHTML=landing();return}
const ic={dash:'',verify:'',protos:'',msgs:'',calls:'',collab:'',cal:''};
r.innerHTML=`<div class="app"><nav class="side ${S.nav?'open':''}"><div class="logo" style="padding:6px 12px 14px;cursor:pointer" onclick="go('dash')">BizUni</div>${Object.keys(ic).map(k=>`<a class="${S.view===k?'on':''}" onclick="go('${k}')">${t(k)}${k==='collab'&&S.offers.some(o=>o.s==='pending')?' <span class="tag er">'+S.offers.filter(o=>o.s==='pending').length+'</span>':''}</a>`).join('')}</nav>
<div class="main"><div class="top"><button class="btn g burger" onclick="S.nav=!S.nav;render()">☰</button><input placeholder="Search your prototypes, deals, messages…" onkeydown="if(event.key==='Enter')gs(this.value)"><button class="btn" style="margin-left:auto" onclick="go('post')">+ Post prototype</button><span>${badge()}</span><select style="width:auto" onchange="S.lang=this.value;render()"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="ms" ${S.lang==='ms'?'selected':''}>Bahasa Melayu</option><option value="es" ${S.lang==='es'?'selected':''}>Español</option></select><button class="btn sm d" onclick="S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;render()">${S.theme==='dark'?'Light':'Dark'}</button></div><div class="ct">${VW[S.view]()}</div></div></div>
<button class="tbtn" onclick="tog()" title="Timmy">🐢</button><div class="card tp" id="tp"><b>Timmy</b><div class="log" id="tlog"></div><div class="row"><input id="ti" placeholder="Ask Timmy…" onkeydown="if(event.key==='Enter')tchat()"><button class="btn sm" onclick="tchat()">Go</button></div></div>
${S.perm?`<div class="modal"><div class="card"><h3>Add to your calendar?</h3><p class="mu">BizUni wants permission to save “Follow-up — ${BZ[S.cb].n}, Oct 17, 3:00 PM” to your calendar for your records.</p><div class="row"><button class="btn" onclick="allow(true)">Allow</button><button class="btn d" onclick="allow(false)">Not now</button></div></div></div>`:''}
${S.sel==='new'?`<div class="modal"><div class="card"><h3>Add prototype</h3><input id="np" placeholder="Prototype name"><br><br><textarea id="nd" placeholder="What problem does it solve?"></textarea><br><br><div class="row"><button class="btn" onclick="addP()">Save</button><button class="btn d" onclick="S.sel=null;render()">Cancel</button></div></div></div>`:''}`}
function addP(){const n=$('#np').value.trim();if(!n)return toast('Name required');S.protos.unshift({n,c:'Services',s:V()?'Pending':'Draft',d:$('#nd').value||'No description yet.',r:0,v:0,rv:[]});S.sel=null;render();toast(V()?'Submitted for review':'Saved as draft — verify to publish')}
render();
</script></body></html>
